name: scope_isolation_parent
steps:
  - id: run_child
    action: dag.run
    with:
      dag: scope_isolation_child

  - id: get_dag_scope
    depends: run_child
    action: state.get
    with:
      scope: dag
      key: k
      default: "MISSING"

  - id: get_root_scope
    depends: get_dag_scope
    action: state.get
    with:
      scope: root_dag
      key: k
      default: "MISSING"

  - id: set_first
    depends: get_root_scope
    action: state.set
    with:
      scope: custom
      namespace: first
      key: k
      value: first

  - id: set_second
    depends: set_first
    action: state.set
    with:
      scope: custom
      namespace: second
      key: k
      value: second

  - id: get_first
    depends: set_second
    action: state.get
    with:
      scope: custom
      namespace: first
      key: k

  - id: get_second
    depends: get_first
    action: state.get
    with:
      scope: custom
      namespace: second
      key: k
