working_dir: .
steps:
  - id: write
    action: outputs.write
    with:
      values:
        greeting: hello
        count: 3
  - id: read
    depends: write
    run: printf 'greeting=%s count=%s strict=%s' "${write.outputs.greeting}" "${write.outputs.count}" "${steps.write.outputs.greeting}"
    stdout: result.out
