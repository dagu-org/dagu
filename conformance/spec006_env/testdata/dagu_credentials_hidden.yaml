working_dir: .
env:
  - FROM_ROOT_ENV: "${DAGU_SECRETS_VAULT_TOKEN}"
steps:
  - name: process-env
    action: exec
    with:
      command: ./write_env
      args:
        - dagu-credentials-env.txt
        - DAGU_ENCRYPTION_KEY
        - DAGU_SECRETS_VAULT_TOKEN
        - DAGU_CONFORMANCE_SETTING
        - FROM_ROOT_ENV
  - name: expansion
    depends: [process-env]
    action: exec
    with:
      command: ./write_arg
      args:
        - dagu-credentials-expansion.txt
        - $DAGU_ENCRYPTION_KEY|${DAGU_SECRETS_VAULT_TOKEN}|$DAGU_CONFORMANCE_SETTING
